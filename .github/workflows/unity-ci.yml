# Hushlands CI: static checks, Unity bootstrap + EditMode/PlayMode tests, Windows x64 build.
# Requires repo secrets: UNITY_LICENSE (or UNITY_SERIAL), UNITY_EMAIL, UNITY_PASSWORD.
name: unity-ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate_project.py

  core:
    # Engine-free core compiled exactly as Unity does (netstandard2.1, C# 9, warnings as errors) + its NUnit tests.
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build tools/dotnet/Core/Hushlands.Core.csproj -warnaserror
      - run: dotnet test tools/dotnet/CoreTests/Hushlands.CoreTests.csproj
      - name: Compile Runtime, Editor and Unity-bound tests against Unity 6 refs + verified package stubs
        run: |
          export UNITY_REFS=$(tools/dotnet/fetch_unity_refs.sh "$RUNNER_TEMP/unityrefs")
          for p in Runtime/Hushlands.Runtime.csproj Editor/Hushlands.Editor.csproj PlayModeTests/Hushlands.PlayModeTests.csproj EditModeUnityTests/Hushlands.EditModeUnityTests.csproj; do
            dotnet build tools/dotnet/$p -warnaserror
          done
      - run: |
          python3 tools/qa/content_sim.py --all-vehicles
          python3 tools/qa/content_sim.py --selftest
          python3 tools/qa/camera_sim.py
          python3 tools/qa/hazard_sim.py
          python3 tools/qa/scarf_sim.py

  test:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-linux-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          customParameters: -executeMethod Hushlands.Editor.ProjectBootstrap.Run
          artifactsPath: test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  build-windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildMethod: Hushlands.Editor.BuildScript.BuildWindows
      - uses: actions/upload-artifact@v4
        with:
          name: Hushlands-Windows
          path: Builds/Windows
